<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Threat Week: a situational cybersecurity simulation from Launching IT Solutions."><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><link rel="icon" type="image/png" href="/logo.png"><title>Threat Week · Launching IT Solutions</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a shift log across the top (Mon–Fri), the "device" where the threat appears on the left, the analyst's decision panel on the right. */
:root{
--bg:#F6F7FB; --surface:#FFFFFF; --surface-2:#ECEEF5; --ink:#11162E; --muted:#5A6276; --line:#D5D9E4;
--accent:#0891B2; --accent-soft:#DDF1F6; --on-accent:#FFFFFF;
--signal:#D97706; --signal-soft:#FCEFD9;
--good:#1F7A4D; --good-soft:#DCF0E3; --warn:#9A6408; --warn-soft:#F8EDD3; --bad:#BE1E45; --bad-soft:#FBE1E7;
--phone:#F1F3F8; --bubble-them:#E4E7F0; --bubble-me:#0891B2;
--f-display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
--f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
--r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
--bg:#0B0F20; --surface:#141A30; --surface-2:#1D2440; --ink:#ECEEF5; --muted:#9AA1B8; --line:#2A3252;
--accent:#22B5D6; --accent-soft:#11334A; --on-accent:#06121E;
--signal:#F59E0B; --signal-soft:#3A2A10;
--good:#5CC089; --good-soft:#163426; --warn:#E8B24E; --warn-soft:#33290F; --bad:#F2708E; --bad-soft:#3D1724;
--phone:#0F1428; --bubble-them:#232B4A; --bubble-me:#1A8FAD; color-scheme:dark } }
:root[data-theme="dark"]{
--bg:#0B0F20; --surface:#141A30; --surface-2:#1D2440; --ink:#ECEEF5; --muted:#9AA1B8; --line:#2A3252;
--accent:#22B5D6; --accent-soft:#11334A; --on-accent:#06121E;
--signal:#F59E0B; --signal-soft:#3A2A10;
--good:#5CC089; --good-soft:#163426; --warn:#E8B24E; --warn-soft:#33290F; --bad:#F2708E; --bad-soft:#3D1724;
--phone:#0F1428; --bubble-them:#232B4A; --bubble-me:#1A8FAD; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.tnum{font-variant-numeric:tabular-nums}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:52px;height:52px;flex:none;object-fit:contain}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.brand .eyebrow{display:block;margin-bottom:1px}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600;cursor:pointer;font-size:14.5px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
/* start */
.start{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:start}
.start h2{font-size:clamp(34px,5.2vw,56px);font-weight:800;letter-spacing:-.02em;margin:6px 0 14px}
.start .lede{font-size:17px;color:var(--muted);max-width:56ch}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:26px}
.howto div{border-top:3px solid var(--accent);padding-top:10px}
.howto b{font-family:var(--f-display);font-size:17px;display:block}
.howto span{font-size:13.5px;color:var(--muted)}
.weekline{display:flex;gap:6px;margin-top:26px;flex-wrap:wrap}
.weekline span{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border-radius:6px;padding:4px 8px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.panel h3{font-size:20px;font-weight:700;margin-bottom:12px}
label.lbl{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{font-family:var(--f-mono);font-size:12.5px;min-height:80px;resize:vertical}
.modes{display:grid;gap:8px;margin:16px 0}
.mode{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--bg)}
.mode input{margin-top:4px;accent-color:var(--accent)}
.mode b{display:block}
.mode small{color:var(--muted);font-size:13px}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.areachips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.resume{margin-top:14px;padding:12px;border-radius:10px;background:var(--warn-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
/* shift strip */
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:18px}
.strip .d{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.strip .bar{display:flex;gap:3px;margin-top:5px}
.strip .bar i{flex:1;height:7px;border-radius:2px;background:var(--surface-2)}
.strip .bar i.done{background:var(--accent)}
.strip .bar i.miss{background:var(--signal)}
.strip .bar i.now{background:var(--ink)}
.strip .day.cur .d{color:var(--ink);font-weight:600}
.play{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:start}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.clock{font-family:var(--f-mono);font-weight:600;font-size:14px}
.pill{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:3px 7px;background:var(--surface-2);color:var(--muted)}
.pill.lv{background:var(--ink);color:var(--bg)}
.count{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
/* devices */
.device{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dev-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.dev-h b{color:var(--ink)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.mail{padding:18px 20px 22px}
.mail-subj{font-family:var(--f-display);font-size:21px;font-weight:700;margin-bottom:12px}
.mail-from{display:flex;gap:10px;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.mail-from .who{min-width:0}
.mail-from .addr{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);word-break:break-all}
.mail-body{display:grid;gap:10px;font-size:15px}
.mail-body .cal{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);padding:8px 10px;border-radius:6px}
.mail-body .fine{font-size:13px;color:var(--muted);font-style:italic}
.attach{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.attach span{font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--bg)}
.lnk{color:var(--accent);text-decoration:underline;cursor:pointer;word-break:break-all}
.lnk-tip{display:block;margin-top:6px;font-family:var(--f-mono);font-size:12px;background:var(--ink);color:var(--bg);border-radius:6px;padding:7px 9px;word-break:break-all}
.hint{font-size:12.5px;color:var(--muted);padding:9px 14px;border-top:1px dashed var(--line);display:flex;gap:6px;align-items:center}
.phone{background:var(--phone);padding:16px;display:grid;gap:10px}
.phone .contact{text-align:center;font-weight:600;font-size:14px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.bub{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14.5px}
.bub.them{background:var(--bubble-them);border-bottom-left-radius:4px}
.bub.me{background:var(--bubble-me);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bub.sys{max-width:100%;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-family:var(--f-mono)}
.call{padding:20px}
.caller{text-align:center;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.caller .nm{font-family:var(--f-display);font-size:24px;font-weight:700}
.caller .num{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.lines{display:grid;gap:12px}
.ln .who{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.ln.note p{font-size:14px;color:var(--muted);font-style:italic}
.ln.say p{border-left:3px solid var(--line);padding-left:11px}
.chat{padding:14px 16px;display:grid;gap:14px}
.cmsg{display:flex;gap:10px}
.cmsg .who{font-weight:700;font-size:13.5px}
.cmsg.ctx{font-size:13.5px;color:var(--muted);font-style:italic;background:var(--surface-2);padding:8px 10px;border-radius:8px}
.scene{padding:20px;display:grid;gap:12px}
.place{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.place svg{width:16px;height:16px;flex:none}
.scene .narr{font-size:16px}
.quote{background:var(--surface-2);border-radius:10px;padding:12px 14px}
.quote .who{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.urlbar{display:flex;align-items:center;gap:8px;margin:0 12px 10px;padding:7px 10px;border-radius:7px;background:var(--bg);font-family:var(--f-mono);font-size:12.5px;word-break:break-all}
.urlbar .ins{color:var(--signal);font-weight:600;flex:none}
.urlbar .secure{color:var(--good);font-weight:600;flex:none}
.bpage{padding:20px;border-top:1px solid var(--line)}
.bpage p+p{margin-top:9px}
.bw-alert{background:#123a8c;color:#fff;border-radius:8px;padding:18px;text-align:center}
.bw-alert .bw-big{font-family:var(--f-display);font-size:24px;font-weight:800}
.bw-alert .bw-phone{font-family:var(--f-mono);font-size:22px;font-weight:600}
.bw-alert .bw-fine{font-size:12.5px;opacity:.8;font-style:italic}
.bw-big2{font-family:var(--f-display);font-size:22px;font-weight:700}
.bw-mono{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.bw-fine{font-size:13px;color:var(--muted);font-style:italic}
.bw-cert .bw-big2{color:var(--bad)}
.bw-btns{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.bw-btn{background:var(--accent);color:var(--on-accent);border-radius:6px;padding:8px 14px;font-weight:600;font-size:13.5px}
.bw-link{font-size:13px;color:var(--muted);text-decoration:underline}
.wifi{padding:16px 18px;display:grid;gap:12px}
.netlist{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.net{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:14.5px}
.net:last-child{border-bottom:0}
.net .nm{flex:1;min-width:0;font-weight:600;word-break:break-word}
.net .lk{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sig{display:flex;gap:2px;align-items:flex-end;height:14px}
.sig i{width:3px;background:var(--line);border-radius:1px}
.sig i.on{background:var(--ink)}
.sign{background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:12px;background:#0b1118}
.tile{aspect-ratio:16/10;max-width:100%;border-radius:8px;background:#1d2a38;color:#dfe7ef;display:grid;place-items:center;position:relative;font-family:var(--f-display);font-size:28px;font-weight:700}
.tile small{position:absolute;left:8px;bottom:6px;font-family:var(--f-body);font-size:11.5px;font-weight:500;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:4px}
.tile.you{background:#2a3644}
/* decision panel */
.decide{position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
.steps{display:flex;gap:4px;margin-bottom:14px}
.steps span{flex:1;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:3px solid var(--surface-2);padding-top:6px}
.steps span.on{color:var(--ink);border-color:var(--accent)}
.steps span.done{border-color:var(--ink)}
.q{font-family:var(--f-display);font-size:21px;font-weight:700;margin-bottom:6px}
.qsub{font-size:13.5px;color:var(--muted);margin-bottom:14px}
.verdicts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vbtn{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:16px 12px;cursor:pointer;text-align:left;display:grid;gap:4px}
.vbtn b{font-family:var(--f-display);font-size:18px}
.vbtn small{color:var(--muted);font-size:12.5px}
.vbtn.safe:hover{border-color:var(--good)} .vbtn.atk:hover{border-color:var(--signal)}
.opts{display:grid;gap:8px;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;background:var(--bg);font-size:14.5px}
.opt input{margin-top:4px;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
/* debrief */
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.score .big{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
.score .of{font-family:var(--f-mono);color:var(--muted)}
.atkname{font-family:var(--f-display);font-size:22px;font-weight:700;margin:2px 0 14px}
.verdict-tag{display:inline-block;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:5px;font-weight:600}
.verdict-tag.a{background:var(--signal-soft);color:var(--signal)}
.verdict-tag.s{background:var(--good-soft);color:var(--good)}
.sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.sec h4{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;font-weight:500}
.sec h4 .pts{color:var(--ink);font-weight:600}
.ev{display:grid;gap:8px;font-size:13.5px}
.ev div{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px}
.ev .mk{font-weight:700;text-align:center}
.ev .why{color:var(--muted);display:block;margin-top:1px}
.mk.ok{color:var(--good)} .mk.no{color:var(--bad)} .mk.mis{color:var(--warn)}
.outcome{border-radius:10px;padding:10px 12px;font-size:14px}
.outcome.good{background:var(--good-soft)} .outcome.mid{background:var(--warn-soft)} .outcome.bad{background:var(--bad-soft)}
.outcome b{display:block;margin-bottom:3px}
.best{font-size:13.5px;margin-top:8px;color:var(--muted)}
.best b{color:var(--ink)}
.lesson{font-size:15px;font-weight:500}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:13.5px}
.dd ul{margin:4px 0 0;padding-left:18px}
.dd .t{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.dd .t.do{color:var(--good)} .dd .t.dont{color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
/* report */
.rep-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;margin-bottom:24px}
.ring{width:150px;height:150px;flex:none}
.rep-head h2{font-size:clamp(28px,4vw,42px);font-weight:800}
.band{display:inline-block;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.07em;padding:4px 9px;border-radius:6px;font-weight:600;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.bars{display:grid;gap:12px}
.brow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.brow .lab{min-width:0}
.brow .lab small{display:block;color:var(--muted);font-size:12px}
.track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.fill{height:100%;border-radius:3px}
.brow .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.focus{background:var(--signal-soft);border-radius:14px;padding:20px}
.focus h3{font-size:22px;margin:4px 0 10px}
.missed{display:grid;gap:10px;margin-top:6px}
.missed div{border-left:3px solid var(--signal);padding-left:12px;font-size:14px}
.missed b{display:block}
.missed span{color:var(--muted)}
.savestate{font-size:13.5px;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.codebox{margin-top:10px;display:grid;gap:8px}
.cert{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px;align-items:center}
.cert canvas{width:100%;height:auto;max-width:100%;border-radius:8px;border:1px solid var(--line);display:block}
@media (max-width:860px){.cert{grid-template-columns:1fr}}
/* instructor */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .n{font-family:var(--f-display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:960px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;background:var(--surface-2)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:center}

{ t: "Asks for gift cards and photos of the codes", k: true, why: "Gift cards are a scammer favorite because they're fast and nearly untraceable. No real business pays this way." },
{ t: "The voice sounds exactly like her", k: false, why: "AI can clone a voice from a short public clip. A perfect match is no longer proof." },
{ t: "Calling from an unknown \"borrowed\" phone", k: true, why: "An excuse for why you can't reach her the normal way blocks verification." },
{ t: "Urgency and a reason she can't talk", k: true, why: "\"Phone's about to die\" keeps you from calling back." },
{ t: "Promises fast reimbursement", k: true, why: "Reassurance about getting your money back is a common push." }
],
responses: [
{ t: "Text the number back to ask a few questions.", p: 10, out: "The \"borrowed phone\" answers instantly with convincing details. You're still talking to the scammer." },
{ t: "Buy the cards. It's definitely her voice.", p: 0, out: "$1,000 drained in minutes. The real Priya was in a meeting the whole time." },
{ t: "Contact Priya on her known number or in Halcyon Chat, and report the voicemail.", p: 40, out: "Priya replies within a minute: \"Not me!\" Security sends a team-wide alert about the voice clone." },
{ t: "Ask a coworker if Priya does this kind of thing.", p: 20, out: "Your coworker is suspicious too, which helps, but neither of you checked with Priya herself." }
],
debrief: { name: "AI voice-clone impersonation", lesson: "A familiar voice is no longer proof of identity. Verify unusual requests through a channel you already trust, and consider a family or team code word.",
dos: ["Call the person back on a number you already have", "Agree on a code word for urgent money requests"],
donts: ["Pay with gift cards for work or emergencies", "Treat a voice match as verification"] } },
{ id: "t6", day: 1, time: "3:00 PM", area: "devices", level: 2, attack: true,
view: { type: "sms", contact: "Halcyon SSO", messages: [
{ from: "sys", text: "Approve sign-in? Halcyon SSO · Bucharest, RO · Windows PC" },
{ from: "sys", text: "Approve sign-in? Halcyon SSO · Bucharest, RO · Windows PC" },

evidence: [

{ t: "Unfamiliar location", k: true, why: "You're in Miami. A login from Bucharest isn't you." },
{ t: "Repeated prompts in quick succession", k: true, why: "This is \"MFA fatigue\": spamming prompts until you tap Approve to make it stop." },

responses: [

],
debrief: { name: "MFA fatigue (push bombing)", lesson: "An approval prompt you didn't trigger means your password is already stolen. Deny it, report it and change your password.",

{ id: "t7", day: 1, time: "4:45 PM", area: "physical", level: 1, attack: true,

],

],

{ id: "w2", day: 2, time: "10:20 AM", area: "ai", level: 3, attack: true,
view: { type: "email", fromName: "Jordan Blake", fromAddr: "jordan.blake@vantage-logistics-talent.com", to: "you@halcyonfreight.com",
subject: "Congrats on the Halcyon role, quick resource for you",
body: "<p>Hi there,</p><p>I saw your post last week about starting as a Dispatch Coordinator at Halcyon Freight. Congratulations! Your point about route-planning tools was spot on.</p><p>Our team just published the 2026 Freight Operations Salary Benchmark, and I thought it might be useful as you settle in. It covers coordinator pay bands across 40 carriers.</p><p><span class=\"lnk\" data-href=\"https://clouddocs-share.net/view/benchmark-2026?login=work\">View the report on CloudDocs</span></p><p>You'll be asked to sign in with your work email to view it. That keeps the report limited to industry professionals.</p><p>Best,<br>Jordan Blake<br>Senior Talent Partner, Vantage Logistics</p>" },
evidence: [
{ t: "Flawless grammar and a professional tone", k: false, why: "AI tools now write perfect phishing. Good writing is no longer a sign of safety." },
{ t: "Uses details from your public social media post", k: true, why: "Personal details make a message feel real. This is spear phishing, built from what you shared." },
{ t: "Wants you to sign in with your work credentials to view a document", k: true, why: "A public report doesn't need your work password. This is credential harvesting." },
{ t: "Link goes to clouddocs-share.net, not the real service", k: true, why: "A look-alike domain hosting a fake login page." },
{ t: "Unsolicited contact from a stranger", k: true, why: "You never asked for this report." }
],
responses: [
{ t: "Sign in. It's a useful report.", p: 0, out: "The \"report\" page captures your work email and password. The attacker now has a foothold in Halcyon." },
{ t: "Open it on your personal phone instead.", p: 5, out: "Same fake login page, different device. Your credentials are still the target." },
{ t: "Reply asking them to attach a PDF instead.", p: 10, out: "They happily send a PDF, with a malicious link inside. Engaging gives them another try." },
{ t: "Don't click. Report it as phishing.", p: 40, out: "Security finds three other new hires got the same email after posting about their jobs." }
],
debrief: { name: "AI-assisted spear phishing", lesson: "Polished writing and personal details are now cheap for attackers. Judge the request, not the polish. A document that wants your work password is a trap.",
dos: ["Be careful what job details you post publicly", "Treat \"sign in to view\" links from strangers as phishing"],
donts: ["Use perfect grammar as proof of legitimacy", "Enter work credentials on sites reached from emails"] } },
{ id: "w3", day: 2, time: "11:30 AM", area: "physical", level: 2, attack: true,
view: { type: "scene", place: "Hallway outside the server room, 2nd floor",
narration: ["A man in a hi-vis vest with a clipboard and a tool bag stops you near the locked server room."],
lines: [
{ who: "Man in vest", text: "Hey, IT sent me to check a switch in there. My contractor badge isn't activated yet, it's my first day on this account. Could you badge me in? I'll be ten minutes, tops." } ] },

{ t: "Name-drops IT without any proof", k: true, why: "\"IT sent me\" is easy to say. Real work orders come with an escort or ticket you can check." },
{ t: "Hi-vis vest, clipboard and tools", k: false, why: "Props are cheap. They make people look like they belong." },
{ t: "Says his badge \"isn't activated yet\"", k: true, why: "A ready-made excuse for why normal access doesn't work." },
{ t: "He wants into the server room", k: true, why: "High-value areas deserve extra care, not less." }
],
responses: [

],

{ id: "w4", day: 2, time: "1:15 PM", area: "phone", level: 2, attack: true,

{ t: "No citation number, officer or agency seal", k: true, why: "Real citations identify the agency and the violation." },
{ t: "Threat of towing and a bigger fine", k: true, why: "Urgency again, pushing you to pay before thinking." },
{ t: "Bright orange paper", k: false, why: "Color tells you nothing." }

],

{ id: "w6", day: 2, time: "4:00 PM", area: "devices", level: 2, attack: true,

{ t: "Downloads an .exe file", k: true, why: "An executable file from a web page can install anything." },
{ t: "Claims you must update to keep reading", k: true, why: "Blocking content until you act is a pressure tactic." },
{ t: "The banner looks professional", k: false, why: "Design quality says nothing about safety." }
],

],

{ id: "h1", day: 3, time: "8:30 AM", area: "email", level: 2, attack: true,
view: { type: "email", fromName: "Riverside Supply Billing", fromAddr: "billing@riversidesupp1y.com", to: "you@halcyonfreight.com",
subject: "RE: Invoice #44871, updated copy",
body: "<p>Hello,</p><p>Following up on invoice #44871 from last month. Our system generated an incorrect total, so please use the corrected copy attached.</p><p>If the document shows as protected, click <b>Enable Editing</b> to view.</p><p>Kind regards,<br>Riverside Supply Accounts Receivable</p>",
attach: ["Invoice_44871_Riverside.pdf.html"] },
evidence: [
{ t: "Domain spells \"supp1y\" with the number 1", k: true, why: "A character swap that's easy to miss at a glance." },
{ t: "Attachment has a double extension (.pdf.html)", k: true, why: "It looks like a PDF but is actually a web page that can show a fake login." },

{ t: "Asks you to click \"Enable Editing\"", k: true, why: "Enabling editing or macros is how many malicious documents run their code." },

],

{ t: "Delete it.", p: 20, out: "You're safe, but Accounts Payable and Riverside never learn that Riverside may be hacked." },

{ id: "h2", day: 3, time: "9:40 AM", area: "phone", level: 1, attack: false,

{ t: "From the same short code as earlier payroll messages", k: true, why: "Consistent with past real messages." },

],

{ id: "h3", day: 3, time: "11:00 AM", area: "phone", level: 2, attack: true,
view: { type: "chat", app: "LinkedUp (professional network)", channel: "Message request", messages: [

{ t: "Stranger contacting you out of nowhere", k: true, why: "No relationship and no way to verify who they are." },

{ id: "h4", day: 3, time: "1:00 PM", area: "network", level: 3, attack: true,
view: { type: "browser", url: "http://192.168.10.1/portal", tab: "Harbor Inn Guest Wi-Fi",
page: "<div class=\"bw-portal\"><p class=\"bw-big2\">Welcome to Harbor Inn</p><p>To protect guests, our network requires a security certificate. Install the <b>Harbor Inn Secure Profile</b> to continue to the internet.</p><div class=\"bw-btns\"><span class=\"bw-btn\">Install Secure Profile</span></div><p class=\"bw-fine\">You're at a hotel for a client visit. The front desk gave you a room-number login, but this page appeared after you connected.</p></div>" },

{ t: "Asks you to install a certificate or profile", k: true, why: "Installing a root certificate lets whoever controls it read and change your encrypted (HTTPS) traffic." },
{ t: "Frames the request as \"protecting guests\"", k: true, why: "Security language is used to make a dangerous step sound responsible." },
{ t: "The page uses the hotel's name and branding", k: false, why: "Branding is easy to copy, and anyone on the network can serve a fake portal." },
{ t: "The front desk only mentioned a room-number login", k: true, why: "Instructions that don't match what staff told you are a red flag." }
],
responses: [
{ t: "Install it. It's the hotel's own portal.", p: 0, out: "Every site you visit now passes through the attacker's certificate, invisibly, with no warnings." },
{ t: "Install it, then remove it when you check out.", p: 5, out: "Everything you do until checkout is exposed. Removing it later doesn't undo that." },
{ t: "Don't install. Use your phone's hotspot or VPN, and mention it to the front desk.", p: 40, out: "The front desk has never heard of a \"secure profile.\" They call their IT vendor." }
],
debrief: { name: "Man-in-the-middle via rogue certificate", lesson: "No legitimate public Wi-Fi requires you to install a certificate or profile. Doing so hands over your encrypted traffic.",
dos: ["Use a hotspot or VPN when traveling", "Check unusual portal steps with staff"],
donts: ["Install certificates or profiles from captive portals"] } },
{ id: "h5", day: 3, time: "3:20 PM", area: "email", level: 1, attack: false,

{ id: "m8", day: 0, time: "5:10 PM", area: "devices", level: 1, attack: false,

{ id: "w9", day: 2, time: "12:15 PM", area: "ai", level: 3, attack: true,
view: { type: "chat", app: "Halcyon AI Assistant (company-approved)", channel: "Summarize document", messages: [

{ t: "Hidden text in the outside document", k: true, why: "Prompt injection hides instructions in content the AI reads, so the AI repeats them as if they were its own." },

</section>
${certOk ? `<div class="panel cert" style="margin-bottom:20px"><div><span class="eyebrow">You earned it</span><h3 style="margin-top:4px">Certificate of completion</h3><p class="note" style="margin-top:0">Scores of ${CERT_MIN}% or higher on the full week, challenge week or post-test earn a certificate.</p>
<div class="actions"><button class="btn primary" id="saveCert">Save certificate (PNG)</button></div><p class="note" id="certMsg"></p></div><canvas id="certCanvas" width="1600" height="1131" aria-label="Certificate of completion for ${esc(run.name)}"></canvas></div>`
: (!assess && run.mode !== "full" && run.mode !== "challenge" ? "" : `<p class="note" style="margin:-8px 0 18px">${assess && run.mode === "assess:pre" ? "Next step: complete the full week, then take the post-test to measure your growth." : `Score ${CERT_MIN}% or higher on the full week, challenge week or post-test to earn a certificate of completion.`}</p>`)}
<div class="grid2">
<div class="panel"><h3>By skill area</h3><div class="bars">${Object.keys(AREAS).filter(k => k in sum.areas).map(k => barRow(AREAS[k].label, sum.areas[k], SCENARIOS.filter(s => s.area === k && run.answers[s.id]).length + " situations")).join("")}</div></div>
<div class="panel"><h3>By thinking skill</h3><div class="bars">
${barRow("Spot", sum.skills.spot, "Recognizing attack vs. safe")}
${barRow("Analyze", sum.skills.analyze, "Identifying the real evidence")}
${barRow("Respond", sum.skills.respond, "Choosing the right action")}
</div>
<h3 style="margin-top:22px">By difficulty</h3><div class="bars">${[1, 2, 3].filter(l => l in sum.levels).map(l => barRow("Level " + l, sum.levels[l])).join("")}</div></div>
</div>
${sum.weakest ? `<div class="focus" style="margin-top:20px"><span class="eyebrow">Focus area</span><h3>${AREAS[sum.weakest].label} · ${weakPct}%</h3>
${assess ? `<p>Answers and lessons stay hidden in assessments so the ${run.mode === "assess:pre" ? "post-test" : "results"} stay${run.mode === "assess:pre" ? "s" : ""} a fair measure. The full week walks through every one of these situations with feedback.</p>`
: weakMissed.length ? `<div class="missed">${weakMissed.map(s => `<div><b>${esc(s.debrief.name)}</b><span>${esc(s.debrief.lesson)}</span></div>`).join("")}</div>` : `<p>This was your lowest area, but you didn't miss any situations badly. Keep sharpening it.</p>`}
<div class="actions"><button class="btn primary" id="drill">Practice ${AREAS[sum.weakest].short}</button></div></div>` : ""}
${!assess && missed.length ? `<div class="panel" style="margin-top:20px"><h3>All situations to review (${missed.length})</h3><div class="missed">${missed.map(s => `<div><b>${DAYS[s.day]} ${s.time} · ${esc(s.debrief.name)} <span class="pill" style="margin-left:4px">${AREAS[s.area].short}</span></b><span>${esc(s.debrief.lesson)}</span></div>`).join("")}</div></div>` : ""}
<div class="panel" style="margin-top:20px"><h3>Share with your instructor</h3>
<div class="savestate" id="saveState">Saving to the class dashboard…</div>
<div class="codebox"><label class="lbl" for="code">Your results code (paste this to your instructor if saving didn't work)</label><textarea id="code" readonly>${encodeSummary(sum)}</textarea>
<div class="actions" style="margin-top:0"><button class="btn" id="copy">Copy results code</button><button class="btn ghost" id="again">Start a new run</button></div></div></div>`;
if (sum.weakest) $("#drill").onclick = () => startRun(run.name, "area:" + sum.weakest);
$("#again").onclick = () => { clearRun(); run = null; renderStart(); };
$("#copy").onclick = () => {
const t = $("#code");
navigator.clipboard.writeText(t.value).then(() => { $("#copy").textContent = "Copied"; }).catch(() => { t.select(); $("#copy").textContent = "Selected: press Ctrl+C / ⌘C"; });
};
if (certOk) {
const cv = $("#certCanvas");
drawCert(cv, run.name, sum);
$("#saveCert").onclick = async () => {
const msg = $("#certMsg");
const dl = window.claude && claude.use ? await claude.use("downloads") : null;
if (!dl) {
cv.toBlob(blob => {
const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
a.download = "Threat Week Certificate - " + run.name.replace(/[^\w .-]/g, "") + ".png";
document.body.appendChild(a); a.click(); a.remove();
setTimeout(() => URL.revokeObjectURL(a.href), 5000);
msg.textContent = "Certificate downloaded.";
}, "image/png");
return;
}
cv.toBlob(async blob => {
try { await dl.save({ filename: "Threat Week Certificate - " + run.name.replace(/[^\w .-]/g, "") + ".png", data: blob }); msg.textContent = "Certificate saved."; }
catch (e) { msg.textContent = e && e.code === "declined" ? "Save canceled." : "Couldn't save the certificate. Try again in a moment."; }
}, "image/png");
};
}
if (!run.saved) saveResult(sum); else $("#saveState").textContent = "Saved to the class dashboard.";
}
const CERT_MIN = 85;
async function drawCert(cv, name, sum) {
try { await Promise.all(['700 80px "Space Grotesk"', '500 30px "Space Grotesk"', '400 28px "Inter"', '600 28px "Inter"', '500 20px "IBM Plex Mono"'].map(f => document.fonts.load(f))); } catch (e) {}
const x = cv.getContext("2d"), W = cv.width, H = cv.height;
const NAVY = "#11162E", CYAN = "#0891B2", AMBER = "#D97706", SLATE = "#5A6276", PAPER = "#FFFFFF";
const SG = '"Space Grotesk", "Segoe UI", sans-serif', IN = '"Inter", "Segoe UI", sans-serif', MO = '"IBM Plex Mono", Consolas, monospace';
x.fillStyle = PAPER; x.fillRect(0, 0, W, H);
x.fillStyle = NAVY; x.fillRect(0, 0, W, 22); x.fillRect(0, H - 22, W, 22);
x.fillStyle = CYAN; x.fillRect(0, 22, W, 8);
x.fillStyle = AMBER; x.fillRect(0, H - 30, W, 8);
x.strokeStyle = "#D5D9E4"; x.lineWidth = 2; x.strokeRect(70, 90, W - 140, H - 180);
x.textAlign = "center"; x.textBaseline = "alphabetic";
const logo = $("#logoImg");
try { if (logo && !logo.complete) await logo.decode(); if (logo && !logo.hidden) { const t = document.createElement("canvas"); t.width = t.height = 8; const tx = t.getContext("2d"); tx.drawImage(logo, 0, 0, 8, 8); tx.getImageData(0, 0, 1, 1); x.drawImage(logo, W / 2 - 60, 104, 120, 120); } } catch (e) {}
x.fillStyle = CYAN; x.font = `500 22px ${MO}`; x.fillText("LAUNCHING IT SOLUTIONS", W / 2, 252);
x.fillStyle = NAVY; x.font = `700 74px ${SG}`; x.fillText("Certificate of Completion", W / 2, 330);
x.fillStyle = SLATE; x.font = `400 28px ${IN}`; x.fillText("This certifies that", W / 2, 408);
let fs = 92; x.font = `700 ${fs}px ${SG}`;
while (x.measureText(name).width > W - 360 && fs > 40) { fs -= 4; x.font = `700 ${fs}px ${SG}`; }
x.fillStyle = NAVY; x.fillText(name, W / 2, 506);
x.fillStyle = AMBER; x.fillRect(W / 2 - 160, 534, 320, 4);
x.fillStyle = NAVY; x.font = `400 30px ${IN}`;
x.fillText(`has completed Threat Week (${modeLabel(sum.mode)}), a situational`, W / 2, 610);
x.fillText(`cybersecurity simulation, with a score of ${sum.overall}%, rated ${band(sum.overall)[0]}.`, W / 2, 654);
const keys = Object.keys(AREAS).filter(k => k in sum.areas), colW = Math.min(220, (W - 400) / keys.length);
keys.forEach((k, i) => {
const cx = W / 2 + (i - (keys.length - 1) / 2) * colW;
x.fillStyle = CYAN; x.font = `700 40px ${SG}`; x.fillText(sum.areas[k] + "%", cx, 756);
x.fillStyle = SLATE; x.font = `500 18px ${MO}`; x.fillText(AREAS[k].short.toUpperCase(), cx, 788);
});
x.strokeStyle = NAVY; x.lineWidth = 2;
x.beginPath(); x.moveTo(240, 930); x.lineTo(700, 930); x.moveTo(W - 700, 930); x.lineTo(W - 240, 930); x.stroke();
x.fillStyle = NAVY; x.font = `600 28px ${IN}`; x.fillText(SIGNER.name, 470, 970); x.fillText(new Date(sum.date).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }), W - 470, 970);
x.fillStyle = SLATE; x.font = `400 22px ${IN}`; x.fillText(SIGNER.title, 470, 1004); x.fillText("Date completed", W - 470, 1004);
x.font = `500 16px ${MO}`; x.fillText("ID " + (Date.parse(sum.date) % 1e8).toString(36).toUpperCase(), W / 2, 1022);
}
async function saveResult(sum) {
const el = $("#saveState");
const fail = msg => { if (el) el.textContent = msg; };
if (!window.claude) return fail("Last step: copy your results code below and send it to your instructor so your scores reach the class dashboard.");
if (!db || !uid) return fail("Couldn't reach the class dashboard from here. Copy your results code below and send it to your instructor.");
try {
const ref = db.doc("results/" + uid);
const snap = await ref.get();
const prev = snap.exists ? (snap.data().attempts || []) : [];
await ref.set({ name: sum.name, updated: Date.now(), attempts: [...prev, sum].slice(-10) });
run.saved = true; save();
if (el) el.textContent = "Saved to the class dashboard. Your instructor can see your results.";
} catch (e) {
fail("Your access doesn't allow saving to the class dashboard. Copy your results code below and send it to your instructor.");
}
}
/* ── instructor dashboard ── */
let rows = [], unsub = null;
function cell(p) { return p == null ? `<span class="cell c-none">–</span>` : `<span class="cell c-${tone(p)}">${p}</span>`; }
function renderInstructor() {
const lastOf = (list, f) => { for (let i = list.length - 1; i >= 0; i--) if (f(list[i])) return list[i]; return null; };
const latest = rows.map(r => {
const train = lastOf(r.attempts, a => !String(a.mode).startsWith("assess"));
return { id: r.id, name: r.name, attempts: r.attempts.length,
last: train || r.attempts[r.attempts.length - 1],
pre: lastOf(r.attempts, a => a.mode === "assess:pre"), post: lastOf(r.attempts, a => a.mode === "assess:post") };
}).filter(r => r.last).sort((a, b) => a.last.overall - b.last.overall);
const growth = latest.filter(r => r.pre && r.post).map(r => r.post.overall - r.pre.overall);
const avgGrowth = growth.length ? Math.round(growth.reduce((a, b) => a + b, 0) / growth.length) : null;
const full = latest.map(r => r.last);
const classArea = {};
Object.keys(AREAS).forEach(k => { const v = full.map(x => x.areas[k]).filter(x => x != null); if (v.length) classArea[k] = Math.round(v.reduce((a, b) => a + b, 0) / v.length); });
const avg = full.length ? Math.round(full.reduce((a, b) => a + b.overall, 0) / full.length) : null;
const weakest = Object.entries(classArea).sort((a, b) => a[1] - b[1])[0];
app.innerHTML = `
<div class="meta" style="margin-bottom:14px"><span class="eyebrow">Instructor view · visible only to you</span></div>
<div class="kpis">
<div class="kpi"><div class="eyebrow">Students</div><div class="n">${latest.length}</div></div>
<div class="kpi"><div class="eyebrow">Class average</div><div class="n" style="color:${avg == null ? "var(--muted)" : toneColor(avg)}">${avg == null ? "–" : avg + "%"}</div></div>
<div class="kpi"><div class="eyebrow">Avg. pre → post growth</div><div class="n" style="color:${avgGrowth == null ? "var(--muted)" : avgGrowth >= 0 ? "var(--good)" : "var(--bad)"}">${avgGrowth == null ? "–" : (avgGrowth >= 0 ? "+" : "") + avgGrowth + " pts"}</div><div class="note" style="margin:0">${growth.length} with both tests</div></div>
<div class="kpi"><div class="eyebrow">Weakest area</div><div class="n" style="font-size:22px;padding-top:6px">${weakest ? AREAS[weakest[0]].label + " · " + weakest[1] + "%" : "–"}</div></div>
</div>
<div class="grid2" style="margin-bottom:20px">
<div class="panel"><h3>Class average by area</h3>${Object.keys(classArea).length ? `<div class="bars">${Object.keys(AREAS).filter(k => k in classArea).map(k => barRow(AREAS[k].label, classArea[k])).join("")}</div>` : `<p class="note">Bars appear once students finish a run.</p>`}</div>
<div class="panel"><h3>Add a result by code</h3><p class="note" style="margin:0 0 10px">Students who can't save directly can copy their results code from their report card. Paste it here to add them to the dashboard.</p>
<textarea id="imp" placeholder="LTW1.…"></textarea><div class="actions"><button class="btn primary" id="impBtn">Add result</button><span id="impMsg" class="note" style="margin:0;align-self:center"></span></div></div>
</div>
<div class="tablewrap">${latest.length ? `<table><thead><tr><th>Student</th><th>Latest</th><th>Pre</th><th>Post</th><th>Growth</th><th>Runs</th>${Object.values(AREAS).map(a => `<th>${a.short}</th>`).join("")}<th>Spot</th><th>Analyze</th><th>Respond</th><th>Focus area</th></tr></thead><tbody>
${latest.map(r => `<tr><td data-n="${r.id}"></td><td class="n">${cell(r.last.overall)}</td><td class="n">${r.pre ? cell(r.pre.overall) : cell(null)}</td><td class="n">${r.post ? cell(r.post.overall) : cell(null)}</td><td class="n">${r.pre && r.post ? `<b style="color:${r.post.overall >= r.pre.overall ? "var(--good)" : "var(--bad)"}">${r.post.overall >= r.pre.overall ? "+" : ""}${r.post.overall - r.pre.overall}</b>` : "–"}</td><td class="n">${r.attempts}</td>${Object.keys(AREAS).map(k => `<td class="n">${cell(r.last.areas[k])}</td>`).join("")}<td class="n">${cell(r.last.skills.spot)}</td><td class="n">${cell(r.last.skills.analyze)}</td><td class="n">${cell(r.last.skills.respond)}</td><td>${r.last.weakest ? AREAS[r.last.weakest].short : "–"}</td></tr>`).join("")}
</tbody></table>` : `<div class="empty"><b>No results yet.</b><br>When students finish a run, their scores appear here automatically, sorted so the students who need the most help are at the top.</div>`}</div>`;
latest.forEach(r => { const td = app.querySelector(`td[data-n="${r.id}"]`); if (td) td.textContent = r.name || "Unnamed"; });
$("#impBtn").onclick = async () => {
const msg = $("#impMsg");
let o; try { o = decodeSummary($("#imp").value); } catch (e) { msg.textContent = "That code isn't valid. Check that it was copied in full."; return; }
try {
const id = "imp_" + String(o.name || "student").toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 40) + "-" + Date.parse(o.date || 0);
await db.doc("results/" + id).set({ name: String(o.name || "Unnamed").slice(0, 60), updated: Date.now(), attempts: [o], imported: true });
$("#imp").value = ""; msg.textContent = "Added " + (o.name || "student") + ".";
} catch (e) { msg.textContent = "Couldn't save that result. Try again in a moment."; }
};
}
function watchResults() {
if (unsub || !db) return;
const timer = setTimeout(() => { if (view === "instructor" && !rows.length) { const e = $(".empty"); if (e) e.innerHTML = "<b>Still loading results.</b><br>The class data can't be reached yet."; } }, 10000);
unsub = db.collection("results").onSnapshot(snap => {
clearTimeout(timer);
rows = snap.docs.map(d => ({ id: d.id, name: d.data().name, attempts: d.data().attempts || [] }));
if (view === "instructor") renderInstructor();
}, () => { clearTimeout(timer); });
}
function setView(v) {
view = v;
$("#tabStudent").setAttribute("aria-pressed", v === "student");
$("#tabInstructor").setAttribute("aria-pressed", v === "instructor");
if (v === "instructor") { renderInstructor(); watchResults(); }
else if (run) renderPlay(); else renderStart();
}
/* ── boot ── */
(function boot() {
const saved = load();
if (saved && saved.idx >= saved.queue.length) { run = saved; renderReport(); } else renderStart();
if (!window.claude || !window.claude.use) return;
Promise.all([claude.use("db"), claude.use("user")]).then(async ([d, u]) => {
db = d; user = u;
if (user) { uid = await user.id(); isInstructor = (await user.isOwner()) || (await user.canEdit()); }
if (db && isInstructor) {
$("#tabs").hidden = false;
$("#tabStudent").onclick = () => setView("student");
$("#tabInstructor").onclick = () => setView("instructor");
}
if (run && run.idx >= run.queue.length && !run.saved && view === "student") saveResult(summarize(run));
}).catch(() => {});
})();
</script>
</body></html>
